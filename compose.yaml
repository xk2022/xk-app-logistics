name: xk-logistics-dev

services:
  db:
    image: postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xk_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-xk_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [app]

volumes:
  postgres_data:

networks:
  app:

name: Application quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend

  backend:
    name: Backend verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13'
          cache: maven
      # Use the same default official Central repository identity as SBOM and Docker builds.
      # A shared cache restored from central must not force parent-POM revalidation at repo1.
      - name: Verify with real PostgreSQL Testcontainers
        run: ./mvnw --strict-checksums --batch-mode --no-transfer-progress verify
        working-directory: backend
      - name: Retain JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 14

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13'
          cache: maven
      - name: Install locked npm dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm --prefix frontend ci --ignore-scripts
      - name: Audit browser-test dependencies (including development dependencies)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
      - name: Audit frontend dependencies (including development dependencies)
        if: ${{ !cancelled() }}
        run: npm --prefix frontend audit --audit-level=high
      - name: Generate resolved Maven dependency SBOM
        if: ${{ !cancelled() }}
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DincludeTestScope=true -DschemaVersion=1.6
      - name: Install checksum-verified free scanners
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/xk-scanners" artifacts
          curl --fail --silent --show-error --location https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 --output "$RUNNER_TEMP/xk-scanners/osv-scanner"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/xk-scanners/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/xk-scanners/osv-scanner"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/xk-scanners/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/xk-scanners/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/xk-scanners/gitleaks.tar.gz" --directory "$RUNNER_TEMP/xk-scanners" gitleaks
      - name: Scan npm lockfiles and resolved Maven SBOM with OSV
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-scanners/osv-scanner" scan source
          --lockfile package-lock.json --lockfile frontend/package-lock.json
          --lockfile tests/contracts/requirements.txt
          --lockfile backend/target/bom.json --all-vulns
          --format json --output-file artifacts/osv.json
      - name: Scan repository history for secrets
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-scanners/gitleaks" git --no-banner --redact
          --report-format json --report-path artifacts/gitleaks.json .
      - name: Retain dependency and secret scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            artifacts/
            backend/target/bom.json
          retention-days: 14

  compose-smoke:
    name: Compose and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.yaml:compose.dev.yaml:compose.e2e.yaml
      E2E_BASE_URL: https://localhost:8443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13'
          cache: maven
      - name: Configure isolated disposable development database
        run: |
          test_password=$(openssl rand -hex 24)
          echo "::add-mask::$test_password"
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$test_password/" .env
          sed -i 's/^POSTGRES_DB=.*/POSTGRES_DB=xk_logistics_e2e/' .env
          echo "E2E_FIXTURE_PATH=$RUNNER_TEMP/xk-m2-e2e-fixture.json" >> "$GITHUB_ENV"
          ./infrastructure/generate-dev-tls.sh
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Install hash-pinned independent API contract validators
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.implementation.name == "cpython" and sys.version_info[:2] == (3, 12), "Contract tooling requires CPython 3.12"'
          python3 -m venv "$RUNNER_TEMP/xk-contract-env"
          "$RUNNER_TEMP/xk-contract-env/bin/python" -m pip install --require-hashes -r tests/contracts/requirements.txt
      - name: Compile and prepare isolated test-only TMS runtime
        run: |
          cd backend
          ./mvnw --strict-checksums --batch-mode --no-transfer-progress test-compile dependency:build-classpath -Dmdep.outputFile=target/e2e-classpath.txt -Dmdep.includeScope=test
          cd ..
          python3 tests/e2e/prepare-tms-runtime.py
      - name: Start full isolated stack with explicit synthetic test policy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Validate health, status, and empty-database migration
        run: |
          curl --fail --silent http://127.0.0.1:8084/actuator/health | jq --exit-status '.status == "UP" and keys == ["status"]'
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:5173/api/v1/status | jq --exit-status '.code == "0000" and .data.status == "UP" and .data.service == "xk-logistics" and (.timestamp | endswith("+08:00"))'
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''1'\'' AND success"')" = 1
          curl --fail --silent --cacert infrastructure/dev-tls/localhost.crt https://localhost:8443/api/v1/status | jq --exit-status '.code == "0000" and .data.status == "UP"'
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''2'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT string_agg(tablename, '\'','\'' ORDER BY tablename) FROM pg_tables WHERE schemaname = '\''logistics'\''"')" = adm_change_log,adm_dict_category,adm_dict_item,adm_parameter,adm_parameter_definition,api_idempotency,cargo_item,crm_address,crm_contact,crm_customer,flyway_schema_history,fms_driver,fms_vehicle,order_acceptance_event,order_core,order_draft_revision,task_dependency,tms_assignment,tms_completion,tms_completion_command,tms_dispatch_event,tms_exception,tms_exception_command,tms_exception_event,tms_exception_event_evidence,tms_exception_supplement_evidence,tms_exception_supplement_request,tms_execution,tms_execution_command,tms_execution_event,tms_execution_event_evidence,tms_execution_evidence,tms_execution_evidence_command,tms_execution_evidence_object,tms_idempotency,tms_resource_reservation,tms_task_dispatch,tom_order,transport_task,upms_account,upms_audit,upms_lock
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''3'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT string_agg(code, '\'','\'' ORDER BY code) FROM logistics.adm_dict_category"')" = CONTAINER_TYPE,DRIVER_LICENSE_TYPE,ORDER_TYPE,TASK_KIND,VEHICLE_TYPE
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT string_agg(i.code, '\'','\'' ORDER BY i.code) FROM logistics.adm_dict_item i JOIN logistics.adm_dict_category c ON c.id = i.category_id WHERE c.code = '\''ORDER_TYPE'\'' AND c.read_only"')" = EXPORT,IMPORT,LOCAL
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.adm_dict_item i JOIN logistics.adm_dict_category c ON c.id = i.category_id WHERE c.code <> '\''ORDER_TYPE'\''"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.adm_parameter_definition"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.adm_parameter"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.adm_change_log"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''4'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.crm_customer"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.crm_contact"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.crm_address"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''5'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.order_core"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tom_order"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.cargo_item"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.transport_task"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.task_dependency"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.order_draft_revision"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.api_idempotency"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.upms_account"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.upms_audit"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''6'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.fms_vehicle"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''7'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.fms_driver"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''8'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.order_acceptance_event"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''9'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_task_dispatch"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_assignment"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_resource_reservation"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_dispatch_event"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_idempotency"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_execution"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_execution_event"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_execution_command"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''10'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_execution_evidence"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_execution_evidence_object"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_execution_event_evidence"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_execution_evidence_command"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''11'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_exception"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_exception_event"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_exception_command"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_exception_supplement_request"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_exception_supplement_evidence"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_exception_event_evidence"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''12'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_completion"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_completion_command"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.tms_resource_reservation WHERE completion_id IS NOT NULL"')" = 0
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''13'\'' AND success"')" = 1
          docker compose restart backend
          docker compose up --detach --wait --wait-timeout 120
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE version = '\''1'\'' AND success"')" = 1
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM logistics.flyway_schema_history WHERE success AND version IS NOT NULL"')" = 13
      - name: Create independent isolated synthetic role groups with test-only runner
        working-directory: backend
        run: |
          set -a
          source ../.env
          set +a
          DB_URL="jdbc:postgresql://127.0.0.1:5432/$POSTGRES_DB" DB_USER="$POSTGRES_USER" DB_PASSWORD="$POSTGRES_PASSWORD" \
            java -cp "target/test-classes:target/classes:$(cat target/e2e-classpath.txt)" com.xksystem.logistics.support.E2eFixtureMain
      - name: TLS browser services, roles, orders, FMS and TMS API/workbench on desktop and mobile
        run: npm run test:e2e
      - name: Validate original order schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python" tests/contracts/validate_order_contract.py
          --responses 'test-results/**/order-contract-responses.json'
      - name: Validate independent TOM acceptance schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python" tests/contracts/validate_acceptance_contract.py
          --responses 'test-results/**/acceptance-contract-responses.json'
      - name: Validate independent TMS schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python" tests/contracts/validate_tms_contract.py
          --responses 'test-results/**/tms-contract-responses.json'
      - name: Validate FMS vehicle schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python" tests/contracts/validate_vehicle_contract.py
          --responses 'test-results/**/vehicle-contract-responses.json'
      - name: Validate FMS driver schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python" tests/contracts/validate_driver_contract.py
          --responses 'test-results/**/driver-contract-responses.json'
      - name: Validate independent execution schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python"
          tests/contracts/validate_execution_contract.py
          --responses 'test-results/**/execution-contract-responses.json'
      - name: Validate independent progress and evidence schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python"
          tests/contracts/validate_progress_evidence_contract.py
          --responses 'test-results/**/progress-evidence-contract-responses.json'
      - name: Validate independent exception schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python"
          tests/contracts/validate_exception_contract.py
          --responses 'test-results/**/exception-contract-responses.json'
      - name: Validate independent completion schemas and actual HTTP response artifacts
        if: ${{ !cancelled() }}
        run: >-
          "$RUNNER_TEMP/xk-contract-env/bin/python"
          tests/contracts/validate_completion_contract.py
          --responses 'test-results/**/completion-contract-responses.json'
      - name: Reject browser artifacts containing temporary credentials
        id: report_privacy
        if: ${{ !cancelled() }}
        run: python3 tests/e2e/assert_report_privacy.py
      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-ps.txt
          docker compose logs --no-color > artifacts/compose.log
      - name: Retain browser and service reports
        if: ${{ always() && steps.report_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-browser-reports
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 14
      - name: Remove disposable credentials, containers, and database
        if: always()
        run: |

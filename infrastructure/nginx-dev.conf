# Local-only TLS boundary. Never trust incoming client Forwarded headers.
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/dev-tls/localhost.crt;
    ssl_certificate_key /etc/nginx/dev-tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    access_log off;

    # Only the exact private upload route can reach the application's bounded 1 MiB reader.
    location ~* "^/api/v1/tms/my-tasks/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/evidence$" {
        client_max_body_size 2m;
        proxy_pass http://backend:8084;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    location /api/ {
        proxy_pass http://backend:8084;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    location = /actuator/health {
        proxy_pass http://backend:8084;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
    }
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

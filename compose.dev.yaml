# DEV only. Database and application ports bind to the local machine.
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-xk_logistics}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-xk_dev}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only password in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8084}:8084"
    depends_on:
      db:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY_TARGET: http://backend:8084
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
  gateway:
    image: nginx:1.30.8-alpine@sha256:6437a63b5c529f0e06162b3f593c0154cff6fa2ea0f94fd7c27928cb399e022d
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./infrastructure/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/dev-tls:/etc/nginx/dev-tls:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

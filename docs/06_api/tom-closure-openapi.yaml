              $ref: '#/components/schemas/Timestamp'
      - if:
          properties:
            auditState:
              const: LEGACY_CLOSED
        then:
          properties:
            lifecycleStatus:
              const: CLOSED
            closedAt:
              type: 'null'
      - if:
          properties:
            auditState:
              const: NOT_CLOSED
        then:
          properties:
            lifecycleStatus:
              enum:
              - OPEN
              - CANCELLED
            closedAt:
              type: 'null'

              const: CLOSED
            acceptanceStatus:
              const: ACCEPTED
            version:
              minimum: 2
            closure:
              $ref: '#/components/schemas/OrderClosureWitness'
            counts:
              type: 'null'
            policy:
              properties:
                canClose:

    UNCONFIRMED；合成all persisted true|null task完整完成+行政確認、整單零occupations/阻擋異常只actual隔離DB，非正式安全責任/optional-waiver/照片/provider批准。legacyCLOSED無新審計誠實null，無新publicdigest或照片API。

            auditState:
              const: LEGACY_CLOSED
        then:
          properties:
            lifecycleStatus:
              const: CLOSED
            closure:
              type: 'null'
            counts:
              type: 'null'
            policy:
              properties:
                canClose:
                  const: false
                blocker:
                  const: ALREADY_CLOSED

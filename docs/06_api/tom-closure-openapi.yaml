components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: XKSESSION
      description: 與JSESSIONID為同一受保護HttpSession別名；Secure/HttpOnly/SameSite=Lax，正常帳號與首次改密限制保持。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
        not:
          pattern: '[^A-Za-z0-9._:-]'
      description: 恰一個 case-sensitive header；未知結果固定原 key/body/path，不自動重送或換 key。
    CompletionId:
      name: completionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OrderFilter:
      name: orderId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
    ConfirmationState:
      name: state
      in: query
      required: false
      schema:
        enum:
        - PENDING
        - CONFIRMED
        - ALL
        default: PENDING
    ClosureState:
      name: state
      in: query
      required: false
      schema:
        enum:
        - OPEN
        - RECORDED
        - LEGACY_CLOSED
        - ALL
        default: OPEN
  responses:
    Error400:
      description: strict JSON/UTF8/raw reason/confirm/query/key驗證；VALIDATION_ERROR+fields，無current counter。
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: 未登入、過期/失效normal帳號或匿名CSRF，null data
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: manager禁止代理或CSRF；reason-only FORBIDDEN/CSRF_INVALID，保留null兼容
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            csrf_invalid:
              value:
                code: E0403
                message: 安全驗證或權限拒絕
                data:
                  reason: CSRF_INVALID
                timestamp: '2026-11-26T10:00:00+08:00'
            forbidden:
              value:
                code: E0403
                message: 安全驗證或權限拒絕
                data:
                  reason: FORBIDDEN
                timestamp: '2026-11-26T10:00:00+08:00'
    Error404:
      description: 非本人/失效assignment/source/occupation/evidence範圍，opaque null
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error405:
      description: 未契約method含HEAD，不回photo bytes
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: E2101–E2110 only；雙版本單位精確分開，no E2111。legacy/DRAFT/CANCELLED taskproof E2102；任意GET錯誤不settle其他POST。
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error413:
      description: 實際InputStream JSON16384上限，先取得原Session；非無上限materialize後才檢查。
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error415:
      description: 不支援media/encoding，null data
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error500:
      description: 安全內部/DB/provider失敗摘要，null data，無路徑與cause
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    Version:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: 本文件 version、expectedVersion、actualVersion 只屬 execution，與 assignment.version／task generation／來源版本分開。
    Timestamp:
      type: string
      format: date-time
      pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt]([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,9})?([Zz]|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$
    CompanyTimestamp:
      type: string
      format: date-time
      pattern: \+08:00$
    PolicyMode:
      type: string
      enum:
      - UNCONFIRMED
      - SYNTHETIC_TEST_ONLY
    ExecutionPhase:
      type: string
      enum:
      - WAITING
      - DEPARTED
      - IN_PROGRESS
      - AWAITING_COMPLETION
      - COMPLETED
      description: M4-01 只可 WAITING→DEPARTED；其餘為後續已授權工作包的讀取 enum 預留，本包不提供其命令或宣稱其政策已核准。
    ExecutionView:
      type: object
      additionalProperties: false
      properties:
        phase:
          $ref: '#/components/schemas/ExecutionPhase'
        version:
          $ref: '#/components/schemas/Version'
        departedAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - phase
      - version
      - departedAt
      allOf:
      - if:
          properties:
            phase:
              const: WAITING
        then:
          properties:
            version:
              const: 0
            departedAt:
              type: 'null'
        else:
          properties:
            version:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            departedAt:
              $ref: '#/components/schemas/Timestamp'
      description: 無 execution row 的本人 GET 虛擬 WAITING/0/null，無 DB／event／receipt 寫入；首次出發才保存 DEPARTED/1。
    IdempotencyReplayed:
      type: string
      enum:
      - 'true'
      - 'false'
    CanonicalUuid:
      allOf:
      - $ref: '#/components/schemas/Uuid'
      - not:
          pattern: '[^0-9a-f-]'
      description: 伺服器輸出 canonical lowercase UUID；request/path UUID 可大小寫，hash前正規化。
    RawNote:
      type: string
      minLength: 1
      maxLength: 1000
      x-nonBlankRawText: true
      description: 原始reason/note，DRIVER可見，非內部staff note；不同原文字面是不同hash，不trim/NFC。
    ActorSnapshot:
      type: object
      additionalProperties: false
      properties:
        role:
          enum:
          - ADMIN
          - DISPATCHER
          - DRIVER
        displayName:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - role
      - displayName
    CompletionWitness:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/CanonicalUuid'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
        releasedAt:
          $ref: '#/components/schemas/Timestamp'
        policyMode:
          const: SYNTHETIC_TEST_ONLY
        safeReleaseConfirmed:
          const: true
      required:
      - id
      - completedAt
      - releasedAt
      - policyMode
      - safeReleaseConfirmed
      x-equalTimestampFields:
      - completedAt
      - releasedAt
      description: 獨立不可變完成/實際解除占用事實；兩時間同次伺服器instant。safeReleaseConfirmed記錄明確confirmSafeRelease及合成server決策，不批准正式安全確認者責任。無actor/resource
        IDs。
    SafeVersion:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: 上下文精確單位：confirmation version/expectedVersion/actualConfirmationVersion為行政counter0或1；order version/expectedVersion/actualOrderVersion為TOM
        aggregate。sourceOrderVersion/sourceVersion保留accepted來源版；不是不存在的OrderCore.version，亦不是execution/assignment/generation。
    SourceVersion:
      allOf:
      - $ref: '#/components/schemas/SafeVersion'
      - minimum: 1
    ConfirmationVersion:
      type: integer
      minimum: 0
      maximum: 1
    ManagerActor:
      allOf:
      - $ref: '#/components/schemas/ActorSnapshot'
      - properties:
          role:
            enum:
            - ADMIN
            - DISPATCHER
    CompletedExecution:
      allOf:
      - $ref: '#/components/schemas/ExecutionView'
      - properties:
          phase:
            const: COMPLETED
          version:
            minimum: 4
    CompletionConfirmationSummary:
      type: object
      additionalProperties: false
      properties:
        completionId:
          $ref: '#/components/schemas/CanonicalUuid'
        assignmentId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskNo:
          type: string
          minLength: 1
          maxLength: 100
        orderId:
          $ref: '#/components/schemas/CanonicalUuid'
        orderNo:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        sourceOrderVersion:
          $ref: '#/components/schemas/SourceVersion'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          $ref: '#/components/schemas/ConfirmationVersion'
        state:
          enum:
          - PENDING
          - CONFIRMED
        confirmedAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - completionId
      - assignmentId
      - taskId
      - taskNo
      - orderId
      - orderNo
      - sourceOrderVersion
      - completedAt
      - version
      - state
      - confirmedAt
      allOf:
      - if:
          properties:
            version:
              const: 0
        then:
          properties:
            state:
              const: PENDING
            confirmedAt:
              type: 'null'
        else:
          properties:
            state:
              const: CONFIRMED
            confirmedAt:
              $ref: '#/components/schemas/Timestamp'
    ManagementConfirmationFact:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/CanonicalUuid'
        version:
          const: 1
        confirmedAt:
          $ref: '#/components/schemas/Timestamp'
        policyMode:
          const: SYNTHETIC_TEST_ONLY
        reason:
          $ref: '#/components/schemas/RawNote'
        actor:
          $ref: '#/components/schemas/ManagerActor'
      required:
      - id
      - version
      - confirmedAt
      - policyMode
      - reason
      - actor
    ManagementConfirmationPolicy:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/PolicyMode'
        canConfirm:
          type: boolean
        blocker:
          enum:
          - null
          - ALREADY_CONFIRMED
          - POLICY_NOT_CONFIRMED
          - ORDER_NOT_OPEN
          - SOURCE_VERSION_MISMATCH
          - UNRESOLVED_EXCEPTIONS
          - PROOF_INVALID
      required:
      - mode
      - canConfirm
      - blocker
      allOf:
      - if:
          properties:
            canConfirm:
              const: true
        then:
          properties:
            mode:
              const: SYNTHETIC_TEST_ONLY
            blocker:
              type: 'null'
        else:
          properties:
            blocker:
              type: string
      - if:
          properties:
            mode:
              const: UNCONFIRMED
        then:
          properties:
            canConfirm:
              const: false
            blocker:
              enum:
              - ALREADY_CONFIRMED
              - POLICY_NOT_CONFIRMED
    CompletionConfirmationDetail:
      type: object
      additionalProperties: false
      properties:
        record:
          $ref: '#/components/schemas/CompletionConfirmationSummary'
        execution:
          $ref: '#/components/schemas/CompletedExecution'
        completion:
          $ref: '#/components/schemas/CompletionWitness'
        confirmation:
          anyOf:
          - $ref: '#/components/schemas/ManagementConfirmationFact'
          - type: 'null'
        policy:
          $ref: '#/components/schemas/ManagementConfirmationPolicy'
      required:
      - record
      - execution
      - completion
      - confirmation
      - policy
      allOf:
      - if:
          properties:
            record:
              properties:
                version:
                  const: 0
        then:
          properties:
            confirmation:
              type: 'null'
            policy:
              properties:
                blocker:
                  not:
                    const: ALREADY_CONFIRMED
        else:
          properties:
            confirmation:
              $ref: '#/components/schemas/ManagementConfirmationFact'
            policy:
              properties:
                canConfirm:
                  const: false
                blocker:
                  const: ALREADY_CONFIRMED
      x-equalFieldPaths:
      - - record.completionId
        - completion.id
      - - record.completedAt
        - completion.completedAt
      - - record.confirmedAt
        - confirmation.confirmedAt
    ConfirmCompletionRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          $ref: '#/components/schemas/SafeVersion'
        confirmCompletion:
          const: true
        reason:
          $ref: '#/components/schemas/RawNote'
      required:

      - confirmCompletion
      - reason
    CompletionConfirmationResult:
      type: object
      additionalProperties: false
      properties:
        completionId:
          $ref: '#/components/schemas/CanonicalUuid'
        assignmentId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskId:
          $ref: '#/components/schemas/CanonicalUuid'
        sourceOrderVersion:
          $ref: '#/components/schemas/SourceVersion'
        version:
          const: 1
        confirmation:
          $ref: '#/components/schemas/ManagementConfirmationFact'
      required:

        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContact'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /crm/customers/{id}/contacts/{contactId}:
    patch:
      operationId: updateContact
      summary: 部分更新／啟停聯絡人，禁止父客戶移轉
      tags:
      - CRM
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Contact'
                  timestamp:

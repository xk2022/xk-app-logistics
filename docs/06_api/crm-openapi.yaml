          format: uuid
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /crm/customer-options:
    get:
      operationId: activeCustomerOptions
      summary: 有效客戶精簡選項；強制enabled，不接受enabled query
      tags:
      - CRM
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PageCustomerOption'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: NFC strip 後最多100 code points，literal contains，%/_ 不作 wildcard。
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - customerCode,asc
          - customerCode,desc
          - name,asc
          - name,desc
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: XKSESSION
      description: UPMS Secure/HttpOnly/SameSite=Lax Session，沿既有登入與強制改密。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: 從auth/csrf取得；所有POST/PATCH必驗證。
  schemas:
    Customer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        customerCode:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_-]{0,63}$
          minLength: 1
          maxLength: 64
          description: 穩定唯一大寫 ASCII 代碼，保留前導零；建立後不可修改。
        name:
          type: string
          maxLength: 200
          description: NFC 並 strip 後最多 200 Unicode code points；拒絕控制字元及不成對 surrogate。必要值不得全為空白（含 Unicode SpaceChar）。
          minLength: 1
          pattern: \S
        taxId:
          type:
          - string
          - 'null'
          maxLength: 50
          description: NFC 並 strip 後最多 50 Unicode code points；拒絕控制字元及不成對 surrogate。空白 optional 值轉 null。
          minLength: 1
          pattern: \S
        phone:
          type:
          - string
          - 'null'
          maxLength: 50
          description: NFC 並 strip 後最多 50 Unicode code points；拒絕控制字元及不成對 surrogate。空白 optional 值轉 null。
          minLength: 1
          pattern: \S
        email:
          type:
          - string
          - 'null'
          maxLength: 254
          description: NFC 並 strip 後最多 254 Unicode code points；拒絕控制字元及不成對 surrogate。空白 optional 值轉 null。 僅基本 email 格式檢查，不驗證存在、不發信。
          minLength: 1
          pattern: \S
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
      required:
      - id
      - customerCode
      - name
      - taxId
      - phone
      - email
      - enabled
      - version
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
    Contact:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
          description: NFC 並 strip 後最多 200 Unicode code points；拒絕控制字元及不成對 surrogate。必要值不得全為空白（含 Unicode SpaceChar）。
          minLength: 1
          pattern: \S
        title:
          type:
          - string
          - 'null'
          maxLength: 100
          description: NFC 並 strip 後最多 100 Unicode code points；拒絕控制字元及不成對 surrogate。空白 optional 值轉 null。
          minLength: 1
          pattern: \S
        phone:
          type:
          - string
          - 'null'
          maxLength: 50
          description: NFC 並 strip 後最多 50 Unicode code points；拒絕控制字元及不成對 surrogate。空白 optional 值轉 null。
          minLength: 1
          pattern: \S
        email:
          type:
          - string
          - 'null'
          maxLength: 254
          description: NFC 並 strip 後最多 254 Unicode code points；拒絕控制字元及不成對 surrogate。空白 optional 值轉 null。 僅基本 email 格式檢查，不驗證存在、不發信。
          minLength: 1
          pattern: \S
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
      required:
      - id
      - customerId
      - name
      - title
      - phone
      - email
      - enabled
      - version
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
    Address:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        label:
          type:
          - string
          - 'null'
          maxLength: 100
          description: NFC 並 strip 後最多 100 Unicode code points；拒絕控制字元及不成對 surrogate。空白 optional 值轉 null。
          minLength: 1
          pattern: \S
        address:
          type: string
          maxLength: 1000
          description: NFC 並 strip 後最多 1000 Unicode code points；允許 LF，拒絕控制字元及不成對 surrogate。必要值不得全為空白（含 Unicode SpaceChar）。
          minLength: 1
          pattern: \S
        addressType:
          type:
          - string
          - 'null'
          maxLength: 40
          description: NFC 並 strip 後最多 40 Unicode code points；拒絕控制字元及不成對 surrogate。空白 optional 值轉 null。
          minLength: 1
          pattern: \S
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time

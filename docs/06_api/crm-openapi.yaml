          - updatedAt,asc
          - updatedAt,desc
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
    post:
      operationId: createContact
      summary: 新增聯絡人，父關聯由伺服器決定
      tags:
      - CRM
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Contact'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':

        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: NFC strip 後最多100 code points，literal contains，%/_ 不作 wildcard。
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
          - title,asc
          - title,desc
          - createdAt,asc

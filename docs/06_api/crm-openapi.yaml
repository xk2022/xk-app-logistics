      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContact'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /crm/customers/{id}/addresses:
    get:
      operationId: listAddresses
      summary: 父客戶範圍內常用地址分頁查詢
      tags:
      - CRM
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PageAddress'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: NFC strip 後最多100 code points，literal contains，%/_ 不作 wildcard。
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - label,asc
          - label,desc
          - addressType,asc
          - addressType,desc
          - createdAt,asc
          - createdAt,desc
          - updatedAt,asc
          - updatedAt,desc
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
    post:
      operationId: createAddress
      summary: 新增常用地址；用途僅描述文字，不是業務枚舉
      tags:
      - CRM
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Address'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddress'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /crm/customers/{id}/addresses/{addressId}:
    patch:
      operationId: updateAddress
      summary: 部分更新／啟停地址，禁止父客戶移轉
      tags:
      - CRM
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Address'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':

openapi: 3.1.0
info:
  title: XK Logistics CRM API
  version: 0.1.0
  description: LG-M2-03 獨立CRM契約；全部HTTP僅正常登入ADMIN／DISPATCHER、DRIVER拒絕。單公司，嚴格body/query白名單，無DELETE、無seed。taxId可空非unique，不套特定稅務規則；phone不限定單國。停用父客戶不供新引用，但仍可維護CRM歷史主檔。未實作TOM/FMS/派工，不修改既有訂單OpenAPI；真正訂單快照寫入在M2-04驗收。
servers:
- url: /api/v1
tags:
- name: CRM
security:
- sessionCookie: []
paths:
  /crm/customers:
    get:
      operationId: listCustomers
      summary: ADMIN／DISPATCHER 本公司客戶分頁搜尋
      tags:
      - CRM
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PageCustomer'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: NFC strip 後最多100 code points，literal contains，%/_ 不作 wildcard。
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - customerCode,asc
          - customerCode,desc
          - name,asc
          - name,desc
          - createdAt,asc
          - createdAt,desc
          - updatedAt,asc
          - updatedAt,desc
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
    post:
      operationId: createCustomer
      summary: 建立穩定代碼與客戶名稱；其他欄位可省略
      tags:
      - CRM
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer'
  /crm/customers/{id}:
    get:
      operationId: getCustomer
      summary: 客戶明細，含停用歷史主檔
      tags:
      - CRM
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCustomer
      summary: 部分更新／啟停；version及至少一個mutable欄位
      tags:
      - CRM
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    const: '0000'
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
                  timestamp:
                    type: string
                    format: date-time
                    description: +08:00
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomer'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

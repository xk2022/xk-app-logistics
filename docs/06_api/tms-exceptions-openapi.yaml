components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: XKSESSION
      description: 與JSESSIONID為同一受保護HttpSession別名；Secure/HttpOnly/SameSite=Lax，正常帳號與首次改密限制保持。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
        not:
          pattern: '[^A-Za-z0-9._:-]'
      description: 恰一個 case-sensitive header；未知結果固定原 key/body/path，不自動重送或換 key。
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 100000
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    ExecutionVersion:
      name: X-Execution-Version
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ExecutionVersionHeader'
      description: 恰一個header，預期目前execution版本；stage serverderived，無client phase/time/type。
    ExceptionVersion:
      name: X-Exception-Version
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ExecutionVersionHeader'
      description: 異常expectedVersion；先於X-Execution-Version核對，實際值單位不得混淆。
    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ExceptionStatus'
    AssignmentFilter:
      name: assignmentId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    Error400:
      description: strict shape/query/header/PNG bytes驗證，VALIDATION_ERROR+fields
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: 未登入、過期/失效normal帳號或匿名CSRF，null data
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: manager禁止代理或CSRF；reason-only FORBIDDEN/CSRF_INVALID，保留null兼容
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            csrf_invalid:
              value:
                code: E0403
                message: 安全驗證或權限拒絕
                data:
                  reason: CSRF_INVALID
                timestamp: '2026-11-26T10:00:00+08:00'
            forbidden:
              value:
                code: E0403
                message: 安全驗證或權限拒絕
                data:
                  reason: FORBIDDEN
                timestamp: '2026-11-26T10:00:00+08:00'
    Error404:
      description: 非本人/失效assignment/source/occupation/evidence範圍，opaque null
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error405:
      description: 未契約method含HEAD，不回photo bytes
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: 獨立E1901–08，版本／狀態／政策／重送／關聯／補件；兩種actual版本單位明確。
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error413:
      description: 應用程式實際stream超1048576，E0413/null；更大edge拒絕不宣稱appJSON
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error415:
      description: 不支援media/encoding，null data
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error500:
      description: 安全內部/DB/provider失敗摘要，null data，無路徑與cause
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    CanonicalUuid:
      allOf:
      - $ref: '#/components/schemas/Uuid'
      - not:
          pattern: '[^0-9a-f-]'
      description: 伺服器輸出 canonical lowercase UUID；request/path UUID 可大小寫，hash前正規化。
    Version:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: 安全數學整數範圍可重用，版本單位依欄位判定。異常record／summary／event／supplement收據的version、異常命令expectedVersion及actualVersion屬exception；ExecutionView.version與reportedExecutionVersion／expectedExecutionVersion／actualExecutionVersion屬execution；與assignment.version、task generation及TOM／FMS版本分開。
    Timestamp:
      type: string
      format: date-time
      pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt]([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,9})?([Zz]|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$
    CompanyTimestamp:
      type: string
      format: date-time
      pattern: \+08:00$
    ExecutionPhase:
      type: string
      enum:
      - WAITING
      - DEPARTED
      - IN_PROGRESS
      - AWAITING_COMPLETION
      - COMPLETED
      description: M4-01 只可 WAITING→DEPARTED；其餘為後續已授權工作包的讀取 enum 預留，本包不提供其命令或宣稱其政策已核准。
    ExecutionView:
      type: object
      additionalProperties: false
      properties:
        phase:
          $ref: '#/components/schemas/ExecutionPhase'
        version:
          $ref: '#/components/schemas/Version'
        departedAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - phase
      - version
      - departedAt
      allOf:
      - if:
          properties:
            phase:
              const: WAITING
        then:
          properties:
            version:
              const: 0
            departedAt:
              type: 'null'
        else:
          properties:
            version:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            departedAt:
              $ref: '#/components/schemas/Timestamp'
      description: 無 execution row 的本人 GET 虛擬 WAITING/0/null，無 DB／event／receipt 寫入；首次出發才保存 DEPARTED/1。
    IdempotencyReplayed:
      type: string
      enum:
      - 'true'
      - 'false'
    EvidenceIds:
      type: array
      items:
        $ref: '#/components/schemas/Uuid'
      minItems: 0
      maxItems: 32
      uniqueItems: true
      x-uniqueCanonicalUuids: true
      description: 技術上限32；依UUID lowercase後去重檢查並排序，數學集合，不含業務優先順序；重複拒絕、不默默dedupe。
    Evidence:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/CanonicalUuid'
        assignmentId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskId:
          $ref: '#/components/schemas/CanonicalUuid'
        phase:
          $ref: '#/components/schemas/ExecutionPhase'
        executionVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        mediaType:
          const: image/png
        byteSize:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          not:
            pattern: '[^0-9a-f]'
        uploadedAt:
          $ref: '#/components/schemas/Timestamp'
        status:
          const: VERIFIED
      required:
      - id
      - assignmentId
      - taskId
      - phase
      - executionVersion
      - mediaType
      - byteSize
      - sha256
      - uploadedAt
      - status
      description: 不可變十欄本人證據；本包只在DEPARTED/IN_PROGRESS建立，phase保留完整既有讀enum。actual bytes/hash/server time，無actor/account/driver/resource/order/customer、filename、URL、storage
        key/path、原bytes/base64。內部uploader只audit。
    EvidenceRequirements:
      type: object
      additionalProperties: false
      properties:
        minimumCount:
          const: 1
        allowedMediaTypes:
          const:
          - image/png
        maxBytes:
          const: 65536
        maxPixels:
          const: 4096
      required:
      - minimumCount
      - allowedMediaTypes
      - maxBytes
      - maxPixels
      description: 只有隔離合成測試策略的明確數值，不是D06照片分類／數量／格式／大小／必填階段或正式provider核准；normal requirements為null。
    PolicyMode:
      type: string
      enum:
      - UNCONFIRMED
      - SYNTHETIC_TEST_ONLY
    ExecutionVersionHeader:
      type: string
      minLength: 1
      maxLength: 16
      pattern: ^(0|[1-9][0-9]*)$
      not:
        pattern: '[^0-9]'
      format: execution-version-header
      x-maximumNumericValue: 9007199254740991
      description: 恰一header，ASCII digits safe integer；無leading zero/sign/exponent/whitespace/comma，與JSON數學整數文法刻意不同。
    BinaryPng:
      type: string
      format: binary
      x-maxBytes: 1048576
      description: bounded streaming raw PNG，實際bytes/cap/CRC/chunks/dimensions/decoder/hash由產品IT/E2E驗，不寫HTTP JSON
        artifact。
    ReportedPhase:
      type: string
      enum:
      - DEPARTED
      - IN_PROGRESS
      - AWAITING_COMPLETION
    ExceptionStatus:
      type: string
      enum:
      - OPEN
      - NEEDS_SUPPLEMENT
      - RESOLVED
    RawDescription:
      type: string
      minLength: 1
      maxLength: 2000
      x-nonBlankRawText: true
      description: 有效原始Unicode scalar/NUL/NFD/首尾空白/newline逐字保存；只驗codepoints及Unicode whitespace/SpaceChar/FEFF nonblank，不NFC/trim。
    RawNote:
      type: string
      minLength: 1
      maxLength: 1000
      x-nonBlankRawText: true
      description: 原始reason/note，DRIVER可見，非內部staff note；不同原文字面是不同hash，不trim/NFC。
    CanonicalEvidenceIds:
      type: array
      items:
        $ref: '#/components/schemas/CanonicalUuid'
      maxItems: 32
      uniqueItems: true
      x-canonicalUuidOrder: true
      description: canonical lowercase sorted唯一UUID集合；只當前request照片，技術上限32非D06正式數量。
    ExceptionSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/CanonicalUuid'
        assignmentId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskNo:
          type: string
          minLength: 1
          maxLength: 100
        reportedPhase:
          $ref: '#/components/schemas/ReportedPhase'
        status:
          $ref: '#/components/schemas/ExceptionStatus'
        version:
          $ref: '#/components/schemas/Version'
        blocking:
          type: boolean
        reportedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - assignmentId
      - taskId
      - taskNo
      - reportedPhase
      - status
      - version
      - blocking
      - reportedAt
      allOf:
      - if:
          properties:
            status:
              const: RESOLVED
        then:
          properties:
            blocking:
              const: false
        else:
          properties:
            blocking:
              const: true
      - if:
          properties:
            version:
              const: 0
        then:
          properties:
            status:
              const: OPEN
    ActiveSupplementRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/CanonicalUuid'
        reason:
          $ref: '#/components/schemas/RawNote'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        uploadedCount:
          type: integer
          minimum: 0
          maximum: 32
        evidenceIds:
          $ref: '#/components/schemas/CanonicalEvidenceIds'
      required:
      - id
      - reason
      - requestedAt
      - uploadedCount
      - evidenceIds
      x-countMatchesEvidenceIds: true
    ExceptionRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/CanonicalUuid'
        assignmentId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskNo:
          type: string
          minLength: 1
          maxLength: 100
        reportedPhase:
          $ref: '#/components/schemas/ReportedPhase'
        reportedExecutionVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        description:
          $ref: '#/components/schemas/RawDescription'
        status:
          $ref: '#/components/schemas/ExceptionStatus'
        version:
          $ref: '#/components/schemas/Version'
        blocking:
          type: boolean
        reportedAt:
          $ref: '#/components/schemas/Timestamp'
        resolvedAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        resolutionNote:
          anyOf:
          - $ref: '#/components/schemas/RawNote'
          - type: 'null'
        activeRequest:
          anyOf:
          - $ref: '#/components/schemas/ActiveSupplementRequest'
          - type: 'null'
      required:
      - id
      - assignmentId
      - taskId
      - taskNo
      - reportedPhase
      - reportedExecutionVersion
      - description
      - status
      - version
      - blocking
      - reportedAt
      - resolvedAt
      - resolutionNote
      - activeRequest
      allOf:
      - if:
          properties:
            status:
              const: RESOLVED
        then:
          properties:
            blocking:
              const: false
        else:
          properties:
            blocking:
              const: true
      - if:
          properties:
            status:
              const: RESOLVED
        then:
          properties:
            resolvedAt:
              $ref: '#/components/schemas/Timestamp'
            resolutionNote:
              $ref: '#/components/schemas/RawNote'
        else:
          properties:
            resolvedAt:
              type: 'null'
            resolutionNote:
              type: 'null'
      - if:
          properties:
            status:
              const: NEEDS_SUPPLEMENT
        then:
          properties:
            activeRequest:
              $ref: '#/components/schemas/ActiveSupplementRequest'
            version:
              minimum: 1
        else:
          properties:
            activeRequest:
              type: 'null'
      - if:
          properties:
            version:
              const: 0
        then:
          properties:
            status:
              const: OPEN
    ActionAvailability:
      type: object
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        blocker:
          enum:
          - null
          - FORBIDDEN
          - POLICY_NOT_CONFIRMED
          - INVALID_STATE
          - SUPPLEMENT_REQUIRED
          - EVIDENCE_REQUIRED
      required:
      - allowed
      - blocker
      allOf:
      - if:
          properties:
            allowed:
              const: true
        then:
          properties:
            blocker:
              type: 'null'
        else:
          properties:
            blocker:
              type: string
    ExceptionActions:
      type: object
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/PolicyMode'
        requestSupplement:
          $ref: '#/components/schemas/ActionAvailability'
        resolve:
          $ref: '#/components/schemas/ActionAvailability'
        uploadSupplement:
          $ref: '#/components/schemas/ActionAvailability'
        submitSupplement:
          $ref: '#/components/schemas/ActionAvailability'
        requirements:
          anyOf:
          - $ref: '#/components/schemas/EvidenceRequirements'
          - type: 'null'
      required:
      - mode
      - requestSupplement
      - resolve
      - uploadSupplement
      - submitSupplement

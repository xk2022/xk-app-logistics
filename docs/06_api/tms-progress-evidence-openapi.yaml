openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: XK Logistics TMS Progress / Private Evidence API
  version: 0.1.0
  description: LG-M4-02獨立五操作契約。只DEPARTED→IN_PROGRESS→AWAITING_COMPLETION與本人私有照片，不提供完成/釋放/結案/異常/補件/UI或部署。D06/D10/正式provider未批准，normal
    failclosed；PNG/count1/65536bytes/4096pixels僅真實隔離測試DB策略。1048576stream/32IDs屬工程資源上限，非正式照片核准。M401與M1–M3契約bytes不改。
servers:
- url: /api/v1
tags:
- name: TMSProgressEvidence
security:
- sessionCookie: []
paths:
  /tms/my-tasks/{assignmentId}/progress-policy:
    get:
      operationId: getMyProgressPolicy
      tags:
      - TMSProgressEvidence
      summary: getMyProgressPolicy
      description: 先fresh正常DRIVER/目前binding/currentASSIGNED/currentTOMsource/完整occupations，才讀資料/receipt；foreign或失效opaque404。政策/bytea未核准normal
        failclosed，正向只隔離synthetic。
      x-allowedRoles:
      - DRIVER
      x-deniedRoles:
      - ADMIN
      - DISPATCHER
      security:
      - sessionCookie: []
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      parameters:
      - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: 本人目前純讀或原次不可變成功收據；binary不進JSONcollector。
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store, private
              description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressPolicyEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
  /tms/my-tasks/{assignmentId}/progress:
    post:
      operationId: reportMyTaskProgress
      tags:
      - TMSProgressEvidence
      summary: reportMyTaskProgress
      description: 先fresh正常DRIVER/目前binding/currentASSIGNED/currentTOMsource/完整occupations，才讀資料/receipt；foreign或失效opaque404。政策/bytea未核准normal
        failclosed，正向只隔離synthetic。
      x-allowedRoles:
      - DRIVER
      x-deniedRoles:
      - ADMIN
      - DISPATCHER
      security:
      - sessionCookie: []
        csrfToken: []
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      parameters:
      - $ref: '#/components/parameters/AssignmentId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 本人目前純讀或原次不可變成功收據；binary不進JSONcollector。
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store, private
              description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
            Idempotency-Replayed:
              required: true
              schema:
                $ref: '#/components/schemas/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      x-replayRule: fresh現在本人/currentassignment/source/完整occupations先於receipt；合法同key/hash原收據先於目前phase/version/policy，不再寫入；401/CSRF/404不能證明先前未知交易回滾。
      x-versionRule: upload不升executionversion；progress固定expectedVersion+1、保留departedAt，不動assignment/generation/occupations/TOM/FMS/dependencies。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressCommand'
  /tms/my-tasks/{assignmentId}/evidence:
    post:
      operationId: uploadMyTaskEvidence
      tags:
      - TMSProgressEvidence
      summary: uploadMyTaskEvidence
      description: 先fresh正常DRIVER/目前binding/currentASSIGNED/currentTOMsource/完整occupations，才讀資料/receipt；foreign或失效opaque404。政策/bytea未核准normal
        failclosed，正向只隔離synthetic。
      x-allowedRoles:
      - DRIVER
      x-deniedRoles:
      - ADMIN
      - DISPATCHER
      security:
      - sessionCookie: []
        csrfToken: []
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      parameters:
      - $ref: '#/components/parameters/AssignmentId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ExecutionVersion'
      responses:
        '200':
          description: 本人目前純讀或原次不可變成功收據；binary不進JSONcollector。
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store, private
              description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
            Idempotency-Replayed:
              required: true
              schema:
                $ref: '#/components/schemas/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      x-replayRule: fresh現在本人/currentassignment/source/完整occupations先於receipt；合法同key/hash原收據先於目前phase/version/policy，不再寫入；401/CSRF/404不能證明先前未知交易回滾。
      x-versionRule: upload不升executionversion；progress固定expectedVersion+1、保留departedAt，不動assignment/generation/occupations/TOM/FMS/dependencies。
      requestBody:
        required: true
        content:
          image/png:
            schema:
              $ref: '#/components/schemas/BinaryPng'
      x-maxStreamBytes: 1048576
      x-rejectDuplicateHeaders:
      - Content-Type
      - Content-Encoding
      - X-Execution-Version
      - Idempotency-Key
      x-rejectMediaParameters: true
      x-allowedContentEncodings:
      - identity
    get:
      operationId: listMyTaskEvidence
      tags:
      - TMSProgressEvidence
      summary: listMyTaskEvidence
      description: 先fresh正常DRIVER/目前binding/currentASSIGNED/currentTOMsource/完整occupations，才讀資料/receipt；foreign或失效opaque404。政策/bytea未核准normal
        failclosed，正向只隔離synthetic。
      x-allowedRoles:
      - DRIVER
      x-deniedRoles:
      - ADMIN
      - DISPATCHER
      security:
      - sessionCookie: []
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      parameters:
      - $ref: '#/components/parameters/AssignmentId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 本人目前純讀或原次不可變成功收據；binary不進JSONcollector。
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store, private
              description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePageEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
  /tms/my-tasks/{assignmentId}/evidence/{evidenceId}/content:
    get:
      operationId: getMyTaskEvidenceContent
      tags:
      - TMSProgressEvidence
      summary: getMyTaskEvidenceContent
      description: 先fresh正常DRIVER/目前binding/currentASSIGNED/currentTOMsource/完整occupations，才讀資料/receipt；foreign或失效opaque404。政策/bytea未核准normal
        failclosed，正向只隔離synthetic。 read-policy/provider permission不等於nextphase規則；AWAITING_COMPLETION仍可合法讀原照片，UNCONFIRMED拒bytes。
      x-allowedRoles:
      - DRIVER
      x-deniedRoles:
      - ADMIN
      - DISPATCHER
      security:
      - sessionCookie: []
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      parameters:
      - $ref: '#/components/parameters/AssignmentId'
      - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: 本人目前純讀或原次不可變成功收據；binary不進JSONcollector。
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store, private
              description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 9007199254740991
            X-Content-Type-Options:
              required: true
              schema:
                const: nosniff
            Content-Disposition:
              required: true
              schema:
                const: inline; filename="evidence.png"
          content:
            image/png:
              schema:
                $ref: '#/components/schemas/BinaryPng'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      x-noConditionalOrRangeServing: true
      x-forbiddenSuccessHeaders:
      - ETag
      - Last-Modified
      - Accept-Ranges
      - Location
      - Content-Location
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: XKSESSION
      description: 與JSESSIONID為同一受保護HttpSession別名；Secure/HttpOnly/SameSite=Lax，正常帳號與首次改密限制保持。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: 目前本人指派選擇器，不是身份override；canonical lowercase path入ledger。
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: 必須同一目前本人assignment之verified evidence；opaque404不推測其他人資料。
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
        not:
          pattern: '[^A-Za-z0-9._:-]'
      description: 恰一個 case-sensitive header；未知結果固定原 key/body/path，不自動重送或換 key。
    ExecutionVersion:
      name: X-Execution-Version
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ExecutionVersionHeader'
      description: 恰一個header，預期目前execution版本；stage serverderived，無client phase/time/type。
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 100000
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  responses:
    Error400:
      description: strict shape/query/header/PNG bytes驗證，VALIDATION_ERROR+fields
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: 未登入、過期/失效normal帳號或匿名CSRF，null data
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: manager禁止代理或CSRF；reason-only FORBIDDEN/CSRF_INVALID，保留null兼容
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            csrf_invalid:
              value:
                code: E0403
                message: 安全驗證或權限拒絕
                data:
                  reason: CSRF_INVALID
                timestamp: '2026-11-26T10:00:00+08:00'
            forbidden:
              value:
                code: E0403
                message: 安全驗證或權限拒絕
                data:
                  reason: FORBIDDEN
                timestamp: '2026-11-26T10:00:00+08:00'
    Error404:
      description: 非本人/失效assignment/source/occupation/evidence範圍，opaque null
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error405:
      description: 未契約method含HEAD，不回photo bytes
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: E1801–08版本/狀態/政策/重送/受保護關聯/證據
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error413:
      description: 應用程式實際stream超1048576，E0413/null；更大edge拒絕不宣稱appJSON
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error415:
      description: 不支援media/encoding，null data
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error500:
      description: 安全內部/DB/provider失敗摘要，null data，無路徑與cause
      headers:
        Cache-Control:
          required: true
          schema:
            const: no-store, private
          description: 所有metadata/policy/command/content成功與拒絕皆private/no-store；無共享cache bypass。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    Version:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: 本文件 version、expectedVersion、actualVersion 只屬 execution，與 assignment.version／task generation／來源版本分開。
    Timestamp:
      type: string
      format: date-time
      pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt]([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,9})?([Zz]|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$
    CompanyTimestamp:
      type: string
      format: date-time
      pattern: \+08:00$
    ExecutionPhase:
      type: string
      enum:
      - WAITING
      - DEPARTED
      - IN_PROGRESS
      - AWAITING_COMPLETION
      - COMPLETED
      description: M4-01 只可 WAITING→DEPARTED；其餘為後續已授權工作包的讀取 enum 預留，本包不提供其命令或宣稱其政策已核准。
    ExecutionView:
      type: object
      additionalProperties: false
      properties:
        phase:
          $ref: '#/components/schemas/ExecutionPhase'
        version:
          $ref: '#/components/schemas/Version'
        departedAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - phase
      - version
      - departedAt
      allOf:
      - if:
          properties:
            phase:
              const: WAITING
        then:
          properties:
            version:
              const: 0
            departedAt:
              type: 'null'
        else:
          properties:
            version:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            departedAt:
              $ref: '#/components/schemas/Timestamp'
      description: 無 execution row 的本人 GET 虛擬 WAITING/0/null，無 DB／event／receipt 寫入；首次出發才保存 DEPARTED/1。
    IdempotencyReplayed:
      type: string
      enum:
      - 'true'
      - 'false'
    CanonicalUuid:
      allOf:
      - $ref: '#/components/schemas/Uuid'
      - not:
          pattern: '[^0-9a-f-]'
      description: 伺服器輸出 canonical lowercase UUID；request/path UUID 可大小寫，hash前正規化。
    ProgressTargetPhase:
      type: string
      enum:
      - IN_PROGRESS
      - AWAITING_COMPLETION
    EvidenceIds:
      type: array
      items:
        $ref: '#/components/schemas/Uuid'
      minItems: 0
      maxItems: 32
      uniqueItems: true
      x-uniqueCanonicalUuids: true
      description: 技術上限32；依UUID lowercase後去重檢查並排序，數學集合，不含業務優先順序；重複拒絕、不默默dedupe。
    ProgressCommand:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        targetPhase:
          $ref: '#/components/schemas/ProgressTargetPhase'
        evidenceIds:
          $ref: '#/components/schemas/EvidenceIds'
      required:
      - expectedVersion
      - targetPhase
      - evidenceIds
    ProgressResult:
      type: object
      additionalProperties: false
      properties:
        assignmentId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskId:
          $ref: '#/components/schemas/CanonicalUuid'
        execution:
          allOf:
          - $ref: '#/components/schemas/ExecutionView'
          - properties:
              phase:
                $ref: '#/components/schemas/ProgressTargetPhase'
              version:
                type: integer
                minimum: 2
                maximum: 9007199254740991
      required:
      - assignmentId
      - taskId
      - execution
      description: 原次歷史收據，精確三欄；phase==原request targetPhase、version==expectedVersion+1與departedAt保持，由IT/E2E驗，非目前狀態。
    Evidence:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/CanonicalUuid'
        assignmentId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskId:
          $ref: '#/components/schemas/CanonicalUuid'
        phase:
          $ref: '#/components/schemas/ExecutionPhase'
        executionVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        mediaType:
          const: image/png
        byteSize:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          not:
            pattern: '[^0-9a-f]'
        uploadedAt:
          $ref: '#/components/schemas/Timestamp'
        status:
          const: VERIFIED
      required:
      - id
      - assignmentId
      - taskId
      - phase
      - executionVersion
      - mediaType
      - byteSize
      - sha256
      - uploadedAt
      - status
      description: 不可變十欄本人證據；本包只在DEPARTED/IN_PROGRESS建立，phase保留完整既有讀enum。actual bytes/hash/server time，無actor/account/driver/resource/order/customer、filename、URL、storage
        key/path、原bytes/base64。內部uploader只audit。
    EvidencePage:
      type: object
      additionalProperties: false
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
          maxItems: 100
        page:
          type: integer
          minimum: 0
          maximum: 100000
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          $ref: '#/components/schemas/Version'
        totalPages:
          $ref: '#/components/schemas/Version'
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
    PolicyMode:
      type: string
      enum:
      - UNCONFIRMED
      - SYNTHETIC_TEST_ONLY
    EvidenceRequirements:
      type: object
      additionalProperties: false
      properties:
        minimumCount:
          const: 1
        allowedMediaTypes:
          const:
          - image/png
        maxBytes:
          const: 65536
        maxPixels:
          const: 4096
      required:
      - minimumCount
      - allowedMediaTypes
      - maxBytes
      - maxPixels
      description: 只有隔離合成測試策略的明確數值，不是D06照片分類／數量／格式／大小／必填階段或正式provider核准；normal requirements為null。
    ProgressPolicyView:
      type: object
      additionalProperties: false
      properties:
        assignmentId:
          $ref: '#/components/schemas/CanonicalUuid'
        taskId:
          $ref: '#/components/schemas/CanonicalUuid'
        execution:
          $ref: '#/components/schemas/ExecutionView'
        mode:
          $ref: '#/components/schemas/PolicyMode'
        nextPhase:
          anyOf:
          - $ref: '#/components/schemas/ProgressTargetPhase'
          - type: 'null'
        requirements:
          anyOf:
          - $ref: '#/components/schemas/EvidenceRequirements'
          - type: 'null'
        blocker:
          enum:
          - null
          - POLICY_NOT_CONFIRMED
          - UNSUPPORTED_PHASE
      required:
      - assignmentId
      - taskId
      - execution
      - mode
      - nextPhase
      - requirements
      - blocker
      allOf:
      - if:
          properties:
            mode:
              const: UNCONFIRMED
        then:
          properties:
            blocker:
              const: POLICY_NOT_CONFIRMED
      - if:
          properties:
            blocker:
              enum:
              - POLICY_NOT_CONFIRMED
              - UNSUPPORTED_PHASE
        then:
          properties:
            nextPhase:
              type: 'null'
            requirements:
              type: 'null'
        else:
          properties:
            mode:
              const: SYNTHETIC_TEST_ONLY
            nextPhase:
              $ref: '#/components/schemas/ProgressTargetPhase'
            requirements:
              $ref: '#/components/schemas/EvidenceRequirements'
            execution:
              properties:
                phase:
                  enum:
                  - DEPARTED
                  - IN_PROGRESS
      - if:
          properties:
            blocker:
              const: UNSUPPORTED_PHASE
        then:
          properties:
            mode:
              const: SYNTHETIC_TEST_ONLY
            execution:
              properties:
                phase:
                  enum:
                  - WAITING
                  - AWAITING_COMPLETION
                  - COMPLETED
      - if:
          properties:
            blocker:
              type: 'null'
            execution:
              properties:
                phase:
                  const: DEPARTED
        then:
          properties:
            nextPhase:
              const: IN_PROGRESS
      - if:
          properties:
            blocker:
              type: 'null'
            execution:
              properties:
                phase:
                  const: IN_PROGRESS
        then:
          properties:
            nextPhase:
              const: AWAITING_COMPLETION
      description: 當前純讀投影7欄；unconfirmed/unsupported使用null需求與nextPhase，非0/空照片waiver；雙重阻擋POLICY_NOT_CONFIRMED優先。content
        read permission不取決於是否有next progress rule。
    ExecutionVersionHeader:
      type: string
      minLength: 1
      maxLength: 16
      pattern: ^(0|[1-9][0-9]*)$
      not:
        pattern: '[^0-9]'
      format: execution-version-header
      x-maximumNumericValue: 9007199254740991
      description: 恰一header，ASCII digits safe integer；無leading zero/sign/exponent/whitespace/comma，與JSON數學整數文法刻意不同。
    BinaryPng:
      type: string
      format: binary
      x-maxBytes: 1048576
      description: bounded streaming raw PNG，實際bytes/cap/CRC/chunks/dimensions/decoder/hash由產品IT/E2E驗，不寫HTTP JSON
        artifact。
    ErrorData:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
        actualVersion:
          $ref: '#/components/schemas/Version'
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
      required: []
      minProperties: 1
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - E0400
          - E0401
          - E0403
          - E0404
          - E0405
          - E0413
          - E0415
          - E0500
          - E1801
          - E1802
          - E1803
          - E1804
          - E1805
          - E1806
          - E1807
          - E1808
        message:
          type: string
        data:
          anyOf:
          - $ref: '#/components/schemas/ErrorData'
          - type: 'null'
        timestamp:
          $ref: '#/components/schemas/CompanyTimestamp'
      required:
      - code
      - message
      - data
      - timestamp
      allOf:
      - if:
          properties:
            code:
              const: E1801
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: VERSION_CONFLICT
                required:
                - reason
                - actualVersion
      - if:
          properties:
            code:
              const: E1802
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: INVALID_STATE
                required:
                - reason
      - if:
          properties:
            code:
              const: E1803
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: POLICY_NOT_CONFIRMED
                required:
                - reason
      - if:
          properties:
            code:
              const: E1804
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: IDEMPOTENCY_KEY_REUSED
                required:
                - reason
      - if:
          properties:
            code:
              const: E1805
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: IDEMPOTENCY_IN_PROGRESS
                required:
                - reason
      - if:
          properties:
            code:
              const: E1806
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: PROTECTED_RELATION
                required:
                - reason
      - if:
          properties:
            code:
              const: E1807
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: EVIDENCE_REQUIRED
                required:
                - reason
      - if:
          properties:
            code:
              const: E1808
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: EVIDENCE_INVALID
                required:
                - reason
      - if:
          properties:
            code:
              const: E0400
        then:
          properties:
            data:
              allOf:
              - $ref: '#/components/schemas/ErrorData'
              - properties:
                  reason:
                    const: VALIDATION_ERROR
                required:
                - reason
                - fields
      - if:
          properties:
            code:
              enum:
              - E0401
              - E0404
              - E0405
              - E0413
              - E0415
              - E0500
        then:
          properties:
            data:
              type: 'null'
      - if:
          properties:
            code:
              const: E0403
        then:
          properties:
            data:
              anyOf:
              - type: object
                additionalProperties: false
                properties:
                  reason:
                    enum:
                    - CSRF_INVALID
                    - FORBIDDEN
                required:
                - reason
              - type: 'null'
      description: 獨立E18namespace，無E16/E17/TOM格式。400需要VALIDATION_ERROR+fields；403 reason-only兩值或null相容；401/404/405/413/415/500
        null；409匹配精確reason，E1801需actualVersion。無key/body/SQL/身份/路徑/actualGeneration。

openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: XK Logistics TMS Dispatch API
  version: 0.1.0
  description: LG-M3-04 獨立工程契約，依 Q36–Q40。只有出發前人工派工、撤改、原子占用與本人唯讀。保留原 TOM/FMS/UPMS 契約；沒有 M4 出發、完成、照片、異常或正式部署。預設政策
    fail closed；合成測試政策只來自不進正式 JAR 的 test configuration。規格不代表實際驗收。
servers:
- url: /api/v1
tags:
- name: TMSDispatch
security:
- sessionCookie: []
paths:
  /tms/tasks:
    get:
      operationId: listTmsTasks
      tags:
      - TMSDispatch
      summary: 有界任務及派工摘要
      description: 固定 taskNo/id 排序；server count/page 後以公開 TOM port hydrate，不在單頁 silently filter。
      x-allowedRoles:
      - ADMIN
      - DISPATCHER
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Search'
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNASSIGNED
          - ASSIGNED
          - ALL
          default: UNASSIGNED
      - name: orderId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: 成功；company envelope，非 TOM envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPageEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
  /tms/tasks/{taskId}/dispatch:
    get:
      operationId: getTaskDispatch
      tags:
      - TMSDispatch
      summary: 當前派工與有界歷史
      description: 歷史包含目前派工，assignedGeneration DESC,id 排序；每派工事件至多2筆。
      x-allowedRoles:
      - ADMIN
      - DISPATCHER
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: historyPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: historySize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 成功；company envelope，非 TOM envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchDetailEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
    post:
      operationId: assignTask
      tags:
      - TMSDispatch
      summary: 人工指派與原子占用
      description: 只對 OPEN+ACCEPTED 且前置就緒任務；production policy 全部未核准，不能以行政可用取代適格政策。
      x-allowedRoles:
      - ADMIN
      - DISPATCHER
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功；company envelope，非 TOM envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResultEnvelope'
          headers:
            Idempotency-Replayed:
              required: true
              description: false 新提交；true 原成功業務快照。
              schema:
                $ref: '#/components/schemas/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      x-replayRule: 目前管理權限先驗；同 actor/method/canonical path/key 的成功重播先於目前來源／狀態／政策，不增加 generation、event 或占用；未知結果不自動重試。
      x-versionRule: CommandResult.generation == 原請求 expectedGeneration + 1；原 HTTP200/replay header 與跨請求關係由 IT/E2E
        直接斷言。
  /tms/dispatches/{id}/revoke:
    post:
      operationId: revokeDispatch
      tags:
      - TMSDispatch
      summary: 出發前撤派並原子釋放
      description: 只對目前 ASSIGNED；釋放不要求今日政策或行政可用，不能假造出發／完成。回傳已終止目標。
      x-allowedRoles:
      - ADMIN
      - DISPATCHER
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/DispatchId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功；company envelope，非 TOM envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResultEnvelope'
          headers:
            Idempotency-Replayed:
              required: true
              description: false 新提交；true 原成功業務快照。
              schema:
                $ref: '#/components/schemas/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      x-replayRule: 目前管理權限先驗；同 actor/method/canonical path/key 的成功重播先於目前來源／狀態／政策，不增加 generation、event 或占用；未知結果不自動重試。
      x-versionRule: CommandResult.generation == 原請求 expectedGeneration + 1；原 HTTP200/replay header 與跨請求關係由 IT/E2E
        直接斷言。
  /tms/dispatches/{id}/reassign:
    post:
      operationId: reassignDispatch
      tags:
      - TMSDispatch
      summary: 出發前原子改派及留史
      description: 舊 SUPERSEDED、新 ASSIGNED 與交換占用同交易；任一步失敗保留原派工與占用。回傳新目標。
      x-allowedRoles:
      - ADMIN
      - DISPATCHER
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/DispatchId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功；company envelope，非 TOM envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResultEnvelope'
          headers:
            Idempotency-Replayed:
              required: true
              description: false 新提交；true 原成功業務快照。
              schema:
                $ref: '#/components/schemas/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignRequest'
      x-replayRule: 目前管理權限先驗；同 actor/method/canonical path/key 的成功重播先於目前來源／狀態／政策，不增加 generation、event 或占用；未知結果不自動重試。
      x-versionRule: CommandResult.generation == 原請求 expectedGeneration + 1；原 HTTP200/replay header 與跨請求關係由 IT/E2E
        直接斷言。
  /tms/resources:
    get:
      operationId: listTmsResources
      tags:
      - TMSDispatch
      summary: 有界資源候選與占用阻擋
      description: assignmentId 若有必為本任務目前 ASSIGNED，才可重用自身占用；候選包含占用／行政／政策 blockers，不代表完整組合適格。
      x-allowedRoles:
      - ADMIN
      - DISPATCHER
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      security:
      - sessionCookie: []
      parameters:
      - name: taskId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: position
        in: query
        required: true
        schema:
          type: string
          enum:
          - DRIVER
          - MAIN
          - TRAILER
      - name: assignmentId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: 成功；company envelope，非 TOM envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePageEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
  /tms/my-tasks:
    get:
      operationId: listMyTmsTasks
      tags:
      - TMSDispatch
      summary: 本人目前有效派工最小摘要
      description: 由 fresh DRIVER 與目前有效綁定推導；不能傳 driverId/accountId/orderId。未綁／無效綁定404，有效綁定無派工為空頁。撤改、解綁或撤權立即失去舊權限。
      x-allowedRoles:
      - DRIVER
      x-rejectUnknownQueryParameters: true
      x-rejectDuplicateQueryParameters: true
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功；company envelope，非 TOM envelope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTaskPageEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '500':
          $ref: '#/components/responses/Error500'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: XKSESSION
      description: 與 JSESSIONID 是同一受保護 HttpSession；Secure/HttpOnly/SameSite=Lax。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
        x-normalizedMaxLength: 100
        description: NFC 與外圍空白 strip 後最多100 codepoints；字面搜尋，%/_ 不是 wildcard。
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DispatchId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
      description: 恰一個 header，區分大小寫；不得在未知結果時另產生 key。
  responses:
    Error400:
      description: shape/query/validation/no-op
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error401:
      description: 未登入
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error403:
      description: 已驗證使用者的 E0403 僅以 data.reason 區分 CSRF_INVALID 與 FORBIDDEN，不回傳安全 token 或其他身分資料。匿名 CSRF 拒絕回 401／null。既有 ErrorEnvelope 的 nullable data 保持相容，並非全部 403 必須非 null。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            csrfInvalid:
              summary: 已登入但 CSRF 驗證失敗
              value:
                code: E0403
                message: 安全驗證已更新，請重新整理後再試
                data:
                  reason: CSRF_INVALID
                timestamp: '2026-11-26T10:00:00+08:00'
            forbidden:
              summary: 已登入但沒有本次操作權限
              value:
                code: E0403
                message: 無權執行此操作
                data:
                  reason: FORBIDDEN
                timestamp: '2026-11-26T10:00:00+08:00'
    Error404:
      description: 查無或無有效本人綁定
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error405:
      description: 不允許的方法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error409:
      description: 獨立 TMS 業務衝突碼
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error415:
      description: 不支援的媒體類型
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Error500:
      description: 安全錯誤摘要，不回 SQL/cause/body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    Version:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Timestamp:
      type: string
      format: date-time
      pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt]([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,9})?([Zz]|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$
    CompanyTimestamp:
      type: string
      format: date-time
      pattern: \+08:00$
    SourceDateTime:
      type: string
      format: date-time
      pattern: ^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt]([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,6})?([Zz]|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$
      description: 沿原 TOM 日期、offset 與最多六位小數秒；保留原字面，不新增到期或時窗派工規則。
    NullableSourceDateTime:
      anyOf:
      - $ref: '#/components/schemas/SourceDateTime'
      - type: 'null'
    NullableText:
      anyOf:
      - type: string
        maxLength: 200
        description: 原 TOM 文字，不修剪、正規化或移除有效 NUL；nullable 與空字串不同。
      - type: 'null'
    NullableAddress:
      anyOf:
      - type: string
        maxLength: 1000
      - type: 'null'
    NullableDecimal:
      anyOf:
      - type: string
        maxLength: 32
        pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
        not:
          pattern: '[^0-9.]'
        description: 原 TOM 非負十進位字串，保留 scale；不是 JSON number 或法定載重判斷。
      - type: 'null'
    PolicyMode:
      type: string
      enum:
      - UNCONFIRMED
      - SYNTHETIC_TEST_ONLY
    Blocker:
      type: string
      enum:
      - SOURCE_NOT_ACCEPTED
      - PREREQUISITE_NOT_READY
      - POLICY_NOT_CONFIRMED
      - ALREADY_ASSIGNED
      - ADMIN_UNAVAILABLE
      - RESOURCE_OCCUPIED
    OrderType:
      type: string
      enum:
      - IMPORT
      - EXPORT
      - LOCAL
    ItemSnapshot:
      type: object
      additionalProperties: false
      properties:
        itemKind:
          type: string
          enum:
          - CONTAINER
          - CARGO
        containerType:
          $ref: '#/components/schemas/NullableText'
        containerNo:
          $ref: '#/components/schemas/NullableText'
        packageQty:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 2147483647
          - type: 'null'
        grossWeight:
          $ref: '#/components/schemas/NullableDecimal'
        cbm:
          $ref: '#/components/schemas/NullableDecimal'
      required:
      - itemKind
      - containerType
      - containerNo
      - packageQty
      - grossWeight
      - cbm
    SiteContact:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/NullableText'
        phone:
          $ref: '#/components/schemas/NullableText'
      required:
      - name
      - phone
      description: 原 TOM null 與整組存在但兩欄 null 的讀取語意不合併。
    TaskSummary:
      type: object
      additionalProperties: false
      properties:
        taskId:
          $ref: '#/components/schemas/Uuid'
        taskNo:
          type: string
          minLength: 1
          maxLength: 100
        orderId:
          $ref: '#/components/schemas/Uuid'
        orderNo:
          type: string
          minLength: 1
          maxLength: 100
        orderType:
          $ref: '#/components/schemas/OrderType'
        orderVersion:
          $ref: '#/components/schemas/Version'
        generation:
          $ref: '#/components/schemas/Version'
        taskKind:
          $ref: '#/components/schemas/NullableText'
        pickupName:
          $ref: '#/components/schemas/NullableText'
        deliveryName:
          $ref: '#/components/schemas/NullableText'
        prerequisiteReady:
          type: boolean
        currentAssignmentId:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        policyMode:
          $ref: '#/components/schemas/PolicyMode'
        blockingReasons:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
          uniqueItems: true
          maxItems: 6
      required:
      - taskId
      - taskNo
      - orderId
      - orderNo
      - orderType
      - orderVersion
      - generation
      - taskKind
      - pickupName
      - deliveryName
      - prerequisiteReady
      - currentAssignmentId
      - policyMode
      - blockingReasons
    TaskSource:
      type: object
      additionalProperties: false
      properties:
        taskId:
          $ref: '#/components/schemas/Uuid'
        taskNo:
          type: string
          minLength: 1
          maxLength: 100
        orderId:
          $ref: '#/components/schemas/Uuid'
        orderNo:
          type: string
          minLength: 1
          maxLength: 100
        orderType:
          $ref: '#/components/schemas/OrderType'
        orderVersion:
          $ref: '#/components/schemas/Version'
        item:
          $ref: '#/components/schemas/ItemSnapshot'
        taskKind:
          $ref: '#/components/schemas/NullableText'
        pickupName:
          $ref: '#/components/schemas/NullableText'
        pickupAddress:
          $ref: '#/components/schemas/NullableAddress'
        deliveryName:
          $ref: '#/components/schemas/NullableText'
        deliveryAddress:
          $ref: '#/components/schemas/NullableAddress'
        siteContact:
          anyOf:
          - $ref: '#/components/schemas/SiteContact'
          - type: 'null'
        plannedStartAt:
          $ref: '#/components/schemas/NullableSourceDateTime'
        plannedEndAt:
          $ref: '#/components/schemas/NullableSourceDateTime'
        requiredTask:
          type:
          - boolean
          - 'null'
      required:
      - taskId
      - taskNo
      - orderId
      - orderNo
      - orderType
      - orderVersion
      - item
      - taskKind
      - pickupName
      - pickupAddress
      - deliveryName
      - deliveryAddress
      - siteContact
      - plannedStartAt
      - plannedEndAt
      - requiredTask
